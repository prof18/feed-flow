name: Code Checks
on:
  push:
    branches:
      - 'main'
  pull_request:
    branches:
      - '*'
  workflow_dispatch:

jobs:
  checks:
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - name: Setup environment
        uses: ./.github/actions/setup-gradle
        with:
          gradle-cache-encryption-key: ${{ secrets.GRADLE_CACHE_ENCRYPTION_KEY }}
          desktop-toolchain: 'true'

      - name: Refresh translations
        run: bash .scripts/refresh-translations.sh

      - name: Install Swift Lint
        run: |
          brew install swiftlint

      - name: Run Swift Lint
        run: |
          cd iosApp
          /opt/homebrew/bin/swiftlint
          cd ..

      - name: Create dummy Firebase json
        run: |
          cp config/dummy-google-services.json androidApp/src/debug/google-services.json
          cp config/dummy-google-services.json androidApp/src/release/google-services.json

      - name: Create offline iOS configuration
        run: |
          cp config/dummy-google-service.plist iosApp/GoogleService-Info-dev.plist
          cp config/dummy-google-service.plist iosApp/GoogleService-Info.plist
          cp config/dummy-config.xcconfig iosApp/Assets/Config.xcconfig

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Test helper scripts
        run: python3 -m unittest discover -s .scripts/tests -p 'test_*.py'

      - name: Run Checks
        run: |
          # Prints thread dumps if desktop tests stop progressing; it never stops the build.
          bash .scripts/ci-test-stall-watchdog.sh &
          watchdog_pid=$!
          trap 'kill "$watchdog_pid" 2>/dev/null || true' EXIT
          ./gradlew detekt allTests

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: build-reports
          path: |
            **/build/reports/*
            **/build/test-results/*

      - name: Upload cloud sync artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: cloud-sync-macos
          path: |
            shared/build/cloud-sync-artifacts
            shared/build/reports/tests/swiftCloudSyncTest

  tests-desktop:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Setup environment
        uses: ./.github/actions/setup-gradle
        with:
          gradle-cache-encryption-key: ${{ secrets.GRADLE_CACHE_ENCRYPTION_KEY }}
          desktop-toolchain: 'true'

      - name: Refresh translations
        shell: bash
        run: bash .scripts/refresh-translations.sh

      - name: Install Linux window manager
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends openbox x11-utils xvfb

      - name: Run desktop tests
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            xvfb-run --auto-servernum bash .scripts/with-linux-test-window-manager.sh ./gradlew jvmTest
          else
            ./gradlew jvmTest
          fi

      - name: Upload test reports and cloud snapshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.os }}
          path: |
            **/build/reports/tests
            **/build/test-results/*
            shared/build/cloud-sync-artifacts

  build-android-app:
    name: Build Android App
    runs-on: ubuntu-latest
    needs: [ checks ]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - name: Setup environment
        uses: ./.github/actions/setup-gradle
        with:
          gradle-cache-encryption-key: ${{ secrets.GRADLE_CACHE_ENCRYPTION_KEY }}

      - name: Refresh translations
        run: bash .scripts/refresh-translations.sh

      - name: Create dummy Firebase json
        run: |
          cp config/dummy-google-services.json androidApp/src/debug/google-services.json
          cp config/dummy-google-services.json androidApp/src/release/google-services.json 

      - name: Build Android Sample
        run: ./gradlew :androidApp:assembleGooglePlayDebug

  build-desktop-app:
    name: Build Desktop App
    runs-on: ubuntu-latest
    needs: [ checks ]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - name: Setup environment
        uses: ./.github/actions/setup-gradle
        with:
          gradle-cache-encryption-key: ${{ secrets.GRADLE_CACHE_ENCRYPTION_KEY }}
          desktop-toolchain: 'true'

      - name: Refresh translations
        run: bash .scripts/refresh-translations.sh

      - name: Build Desktop App
        run: ./gradlew :desktopApp:createReleaseDistributable :desktopApp:packageDistributionForCurrentOS

  build-ios-app:
    name: Build iOS App
    runs-on: xcode-27
    needs: [ checks ]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - name: Xcode version
        run: |
          /usr/bin/xcodebuild -version   

      # The iPhone Duo layout uses iOS 27.1 SDK APIs, which Xcode 27.0 doesn't have.
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '27.1'

      - name: Xcode version
        run: |
          /usr/bin/xcodebuild -version 

      - name: Setup environment
        uses: ./.github/actions/setup-gradle
        with:
          gradle-cache-encryption-key: ${{ secrets.GRADLE_CACHE_ENCRYPTION_KEY }}

      - name: Refresh translations
        run: bash .scripts/refresh-translations.sh

      - name: Create Dummy Firebase Plist
        run: |
          cp config/dummy-google-service.plist iosApp/dummy-google-service.plist
          mv iosApp/dummy-google-service.plist iosApp/GoogleService-Info-dev.plist
          cp config/dummy-google-service.plist iosApp/dummy-google-service.plist
          mv iosApp/dummy-google-service.plist iosApp/GoogleService-Info.plist

      - name: Create Config xcconfig
        run: |
          cp config/dummy-config.xcconfig iosApp/Assets/Config.xcconfig

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: |
          cd iosApp
          ./.scripts/generate-project.sh

      - name: Build iOS Sample
        run: |
          set -o pipefail
          cd iosApp
          xcodebuild -project FeedFlow.xcodeproj -configuration Debug -scheme FeedFlow -sdk iphonesimulator -destination "generic/platform=iOS Simulator" ARCHS=arm64 ONLY_ACTIVE_ARCH=YES build | xcbeautify --renderer github-actions
