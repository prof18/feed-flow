name: Code Checks
on:
  push:
    branches:
      - 'main'
  pull_request:
    branches:
      - '*'
  workflow_dispatch:

jobs:
  checks:
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - name: Setup environment
        uses: ./.github/actions/setup-gradle
        with:
          gradle-cache-encryption-key: ${{ secrets.GRADLE_CACHE_ENCRYPTION_KEY }}

      - name: Refresh translations
        run: bash .scripts/refresh-translations.sh

      - name: Install Swift Lint
        run: |
          brew install swiftlint

      - name: Run Swift Lint
        run: |
          cd iosApp
          /opt/homebrew/bin/swiftlint
          cd ..

      - name: Create dummy Firebase json
        run: |
          cp config/dummy-google-services.json androidApp/src/debug/google-services.json
          cp config/dummy-google-services.json androidApp/src/release/google-services.json

      - name: Create offline iOS configuration
        run: |
          cp config/dummy-google-service.plist iosApp/GoogleService-Info-dev.plist
          cp config/dummy-google-service.plist iosApp/GoogleService-Info.plist
          cp config/dummy-config.xcconfig iosApp/Assets/Config.xcconfig

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Run Checks
        run: ./gradlew detekt allTests

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: build-reports
          path: |
            **/build/reports/*

      - name: Upload cloud sync artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: cloud-sync-macos
          path: |
            shared/build/cloud-sync-artifacts
            shared/build/reports/tests/swiftCloudSyncTest

  tests-desktop:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Setup environment
        uses: ./.github/actions/setup-gradle
        with:
          gradle-cache-encryption-key: ${{ secrets.GRADLE_CACHE_ENCRYPTION_KEY }}

      - name: Create dummy Firebase json
        shell: bash
        run: |
          cp config/dummy-google-services.json androidApp/src/debug/google-services.json
          cp config/dummy-google-services.json androidApp/src/release/google-services.json

      - name: Run all tests
        shell: bash
        run: ./gradlew allTests

      - name: Upload test reports and cloud snapshots
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.os }}
          path: |
            **/build/reports/tests
            shared/build/cloud-sync-artifacts

  build-android-app:
    name: Build Android App
    runs-on: ubuntu-latest
    needs: [ checks ]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - name: Setup environment
        uses: ./.github/actions/setup-gradle
        with:
          gradle-cache-encryption-key: ${{ secrets.GRADLE_CACHE_ENCRYPTION_KEY }}

      - name: Refresh translations
        run: bash .scripts/refresh-translations.sh

      - name: Create dummy Firebase json
        run: |
          cp config/dummy-google-services.json androidApp/src/debug/google-services.json
          cp config/dummy-google-services.json androidApp/src/release/google-services.json 

      - name: Build Android Sample
        run: ./gradlew :androidApp:assembleGooglePlayDebug

  build-desktop-app:
    name: Build Desktop App
    runs-on: ubuntu-latest
    needs: [ checks ]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - name: Setup environment
        uses: ./.github/actions/setup-gradle
        with:
          gradle-cache-encryption-key: ${{ secrets.GRADLE_CACHE_ENCRYPTION_KEY }}

      - name: Refresh translations
        run: bash .scripts/refresh-translations.sh

      - name: Build Desktop App
        run: ./gradlew :desktopApp:packageDistributionForCurrentOS

  build-ios-app:
    name: Build iOS App
    runs-on: macos-26
    needs: [ checks ]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - name: Xcode version
        run: |
          /usr/bin/xcodebuild -version   

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.2'

      - name: Xcode version
        run: |
          /usr/bin/xcodebuild -version 

      - name: Setup environment
        uses: ./.github/actions/setup-gradle
        with:
          gradle-cache-encryption-key: ${{ secrets.GRADLE_CACHE_ENCRYPTION_KEY }}

      - name: Refresh translations
        run: bash .scripts/refresh-translations.sh

      - name: Create Dummy Firebase Plist
        run: |
          cp config/dummy-google-service.plist iosApp/dummy-google-service.plist
          mv iosApp/dummy-google-service.plist iosApp/GoogleService-Info-dev.plist
          cp config/dummy-google-service.plist iosApp/dummy-google-service.plist
          mv iosApp/dummy-google-service.plist iosApp/GoogleService-Info.plist

      - name: Create Config xcconfig
        run: |
          cp config/dummy-config.xcconfig iosApp/Assets/Config.xcconfig

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: |
          cd iosApp
          ./.scripts/generate-project.sh

      - name: Build iOS Sample
        run: |
          set -o pipefail
          cd iosApp
          xcodebuild -project FeedFlow.xcodeproj -configuration Debug -scheme FeedFlow -sdk iphonesimulator -destination "generic/platform=iOS Simulator" ARCHS=arm64 ONLY_ACTIVE_ARCH=YES build | xcbeautify --renderer github-actions
