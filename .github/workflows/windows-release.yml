name: Windows Release

on:
  workflow_call:
    secrets:
      GRADLE_CACHE_ENCRYPTION_KEY:
        required: true
      DROPBOX_API_KEY:
        required: true
      SENTRY_DNS:
        required: true
      MSIX_PUBLISHER_DISPLAY_NAME:
        required: true
      TDECK_SALT:
        required: true
      TDECK_APP_ID:
        required: true
      GOOGLE_CREDENTIALS_JSON:
        required: true
      MS_STORE_TENANT_ID:
        required: true
      MS_STORE_CLIENT_ID:
        required: true
      MS_STORE_CLIENT_SECRET:
        required: true
      MS_STORE_APP_ID:
        required: true

jobs:
  deploy:
    runs-on: windows-latest
    timeout-minutes: 90
    outputs:
      release_path: ${{ steps.path_variables.outputs.release_path }}
      artifact_name: ${{ steps.path_variables.outputs.artifact_name }}
      release_path_msix: ${{ steps.path_variables.outputs.release_path_msix }}
      name_msix: ${{ steps.path_variables.outputs.name_msix }}

    steps:
      - uses: actions/checkout@v7

      - name: Setup environment
        uses: ./.github/actions/setup-gradle
        with:
          gradle-cache-encryption-key: ${{ secrets.GRADLE_CACHE_ENCRYPTION_KEY }}

      - name: Refresh translations
        shell: bash
        run: bash .scripts/refresh-translations.sh

      - name: Read version from properties
        id: version
        shell: pwsh
        run: |
          $MAJOR = (Get-Content version.properties | Select-String "MAJOR=").ToString().Split("=")[1]
          $MINOR = (Get-Content version.properties | Select-String "MINOR=").ToString().Split("=")[1]
          $PATCH = (Get-Content version.properties | Select-String "PATCH=").ToString().Split("=")[1]
          $VERSION = "$MAJOR.$MINOR.$PATCH"
          "version=$VERSION" >> $env:GITHUB_OUTPUT
          "VERSION=$VERSION" >> $env:GITHUB_ENV

      - name: Update Licenses file
        run: ./gradlew desktopApp:exportLibraryDefinitions "-PaboutLibraries.exportPath=src/main/resources/"

      - name: Create path variables
        id: path_variables
        shell: pwsh
        run: |
          $name = "FeedFlow-$env:VERSION.msi"
          $path = "desktopApp/build/release/main-release/msi/${name}"
          $name_msix = "FeedFlow-$env:VERSION.msix"
          $path_msix = "desktopApp/build/release/main-release/msix/${name_msix}"
          "release_path=$path" >> $env:GITHUB_OUTPUT
          "artifact_name=$name" >> $env:GITHUB_OUTPUT
          "release_path_msix=$path_msix" >> $env:GITHUB_OUTPUT
          "name_msix=$name_msix" >> $env:GITHUB_OUTPUT
          "RELEASE_PATH=$path" >> $env:GITHUB_ENV
          "ARTIFACT_NAME=$name" >> $env:GITHUB_ENV
          "RELEASE_PATH_MSIX=$path_msix" >> $env:GITHUB_ENV
          "NAME_MSIX=$name_msix" >> $env:GITHUB_ENV
        env:
          VERSION: ${{ steps.version.outputs.version }}

      - name: Create Google credentials.json
        shell: pwsh
        run: |
          $bytes = [Convert]::FromBase64String($env:GOOGLE_CREDENTIALS_JSON)
          [System.IO.File]::WriteAllBytes("desktopApp/src/jvmMain/resources/credentials.json", $bytes)
        env:
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}

      - name: Create Properties file
        shell: pwsh
        run: |
          "is_release=true" >> desktopApp/src/jvmMain/resources/props.properties
          "sentry_dns=$env:SENTRY_DNS" >> desktopApp/src/jvmMain/resources/props.properties
          "version=$env:VERSION" >> desktopApp/src/jvmMain/resources/props.properties
          "dropbox_key=$env:DROPBOX_API_KEY" >> desktopApp/src/jvmMain/resources/props.properties
          "tdeck_app_id=$env:TDECK_APP_ID" >> desktopApp/src/jvmMain/resources/props.properties
          "tdeck_salt=$env:TDECK_SALT" >> desktopApp/src/jvmMain/resources/props.properties
        env:
          SENTRY_DNS: ${{ secrets.SENTRY_DNS }}
          VERSION: ${{ steps.version.outputs.version }}
          DROPBOX_API_KEY: ${{ secrets.DROPBOX_API_KEY }}
          TDECK_SALT: ${{ secrets.TDECK_SALT }}
          TDECK_APP_ID: ${{ secrets.TDECK_APP_ID }}

      - name: Create MSI and app image
        run: ./gradlew packageReleaseMsi createReleaseDistributable

      - name: Package MSIX
        shell: pwsh
        run: .\.scripts\package-msix.ps1
        env:
          MSIX_PUBLISHER_DISPLAY_NAME: ${{ secrets.MSIX_PUBLISHER_DISPLAY_NAME }}

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            **/build/compose/logs/*  

      - name: Upload MSI asset
        if: always()
        uses: actions/upload-artifact@v7
        with:
          path: ${{ env.RELEASE_PATH }}
          name: ${{ env.ARTIFACT_NAME }}
          retention-days: 7

      - name: Upload MSIX asset
        uses: actions/upload-artifact@v7
        with:
          path: ${{ env.RELEASE_PATH_MSIX }}
          name: ${{ env.NAME_MSIX }}
          retention-days: 7 

  # The Store publish is its own job, on Linux, consuming the MSIX the build job
  # just uploaded. Nothing about talking to the Partner Center API needs Windows:
  # pcenter is a static Go binary and the work is HTTP plus a blob upload.
  #
  # Three reasons this is a separate job rather than two more steps above:
  #
  #  1. It is independently retryable. The build above takes the better part of
  #     an hour (DISM, the MSIX packaging tool, makeappx). When a publish fails
  #     for a reason that has nothing to do with the package — a pending draft,
  #     throttling, an expired secret — re-running this job costs a minute
  #     instead of rebuilding the MSIX.
  #  2. Linux runners bill at 1x where Windows bills at 2x, and this job is
  #     minutes.
  #  3. It runs the linux/amd64 archive, which pcenter's own release workflow
  #     smoke-tests and its Homebrew formula installs on every update. The
  #     windows/amd64 archive is the one artifact nothing else exercises.
  #
  # `brew install prof18/tap/pcenter` is deliberately not used here: Homebrew is
  # not preinstalled on the Linux runners, and it would resolve whatever version
  # is current rather than the one this workflow was tested against. Brew is the
  # channel for running these commands by hand.
  publish-store:
    name: Publish to Microsoft Store
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # For assets/storecopy/microsoft-store-release-notes.json only; the
      # package itself comes from the build job's artifact.
      - uses: actions/checkout@v7

      - name: Download the MSIX
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.deploy.outputs.name_msix }}
          path: msix

      - name: Install pcenter
        env:
          PCENTER_VERSION: v0.0.3
        run: |
          set -euo pipefail
          name="pcenter_${PCENTER_VERSION}_linux_amd64.tar.gz"
          base="https://github.com/prof18/pcenter-cli/releases/download/${PCENTER_VERSION}"

          mkdir -p "$RUNNER_TEMP/pcenter"
          cd "$RUNNER_TEMP"
          curl -fsSL -O "$base/$name"
          curl -fsSL -O "$base/checksums.txt"

          # Verified against the release's own checksums.txt: a pinned URL says
          # which release, not that it arrived intact.
          grep " ${name}\$" checksums.txt | sha256sum -c -

          tar -xzf "$name" -C "$RUNNER_TEMP/pcenter"
          echo "$RUNNER_TEMP/pcenter" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/pcenter/pcenter" version

      # Tag pushes publish the submission; manual dispatches only prepare an
      # uncommitted draft in Partner Center and keep the old version live.
      #
      # Credentials arrive as MS_STORE_* environment variables, which pcenter
      # reads directly — nothing is written to the runner and no parameters are
      # plumbed through. Output is JSON here because stdout is not a terminal.
      - name: Publish MSIX to Microsoft Store
        env:
          MS_STORE_TENANT_ID: ${{ secrets.MS_STORE_TENANT_ID }}
          MS_STORE_CLIENT_ID: ${{ secrets.MS_STORE_CLIENT_ID }}
          MS_STORE_CLIENT_SECRET: ${{ secrets.MS_STORE_CLIENT_SECRET }}
          MS_STORE_APP_ID: ${{ secrets.MS_STORE_APP_ID }}
          IS_TAG_RELEASE: ${{ github.event_name == 'push' }}
          NAME_MSIX: ${{ needs.deploy.outputs.name_msix }}
        run: |
          set -euo pipefail

          # Preflight: fail with a readable diagnosis rather than a 401 halfway
          # through the upload.
          pcenter auth doctor

          # --release-notes is mandatory: without an explicit choice pcenter
          # refuses to run, so a forgotten flag can never ship the previous
          # version's changelog. A Store locale missing from the file is a hard
          # failure rather than an empty changelog in someone's language.
          #
          # --replace-pending clears an existing uncommitted draft, since the
          # Store allows only one. Note this deletes ANY pending draft,
          # including one left by a manual dispatch for inspection.
          args=(
            publish msix
            --path "msix/${NAME_MSIX}"
            --release-notes assets/storecopy/microsoft-store-release-notes.json
            --rollout-percentage 90
            --replace-pending
          )

          if [ "$IS_TAG_RELEASE" != 'true' ]; then
            echo "Manual dispatch: preparing the Store submission as a draft without publishing."
            args+=(--skip-commit)
          fi

          pcenter "${args[@]}"
