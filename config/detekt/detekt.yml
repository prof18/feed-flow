# Overrides on top of detekt's default config (`buildUponDefaultConfig = true` in DetektConventionPlugin).
# Only list rules whose settings differ from the defaults.

complexity:
  ComplexCondition:
    allowedConditions: 4
  CyclomaticComplexMethod:
    allowedComplexity: 16
  LargeClass:
    active: false
  LongMethod:
    active: false
  LongParameterList:
    active: false
  TooManyFunctions:
    active: false

coroutines:
  # The flagged uses are the DI modules that provide the dispatchers and a few UI call sites.
  InjectDispatcher:
    active: false

exceptions:
  TooGenericExceptionCaught:
    active: false

naming:
  # Nested `it` and composable `modifier` parameters shadow by design.
  NoNameShadowing:
    active: false
  FunctionNaming:
    functionPattern: '^([a-z$][a-zA-Z$0-9]*)|(`.*`)$'
    ignoreAnnotated:
      - 'Composable'
  MatchingDeclarationName:
    active: false
  TopLevelPropertyNaming:
    constantPattern: '[A-Z][_A-Za-z0-9]*'

potential-bugs:
  # Image vectors cache themselves in a nullable `_icon` and return `_icon!!`.
  UnsafeCallOnNullableType:
    active: false

style:
  # Sealed interfaces change the Swift API that SKIE exports to the iOS app.
  AbstractClassCanBeInterface:
    active: false
  ForbiddenComment:
    active: false
  MagicNumber:
    excludes:
      - '**/test/**'
      - '**/androidHostTest/**'
      - '**/commonTest/**'
      - '**/jvmTest/**'
      - '**/androidUnitTest/**'
      - '**/androidInstrumentedTest/**'
      - '**/jsTest/**'
      - '**/iosTest/**'
      - '**/*.kts'
    ignoreRanges: true
  ReturnCount:
    active: false
  ThrowsCount:
    excludeGuardClauses: true
  UnusedPrivateFunction:
    ignoreAnnotated:
      - 'Preview'
      - 'PreviewPhone'
      - 'PreviewTablet'
      - 'PreviewFoldable'

ktlint:
  code_style: intellij_idea
  # Image vectors use a `_name` cache without a matching public property.
  BackingPropertyNaming:
    active: false
  BlankLineBetweenWhenConditions:
    active: false
  ClassSignature:
    active: false
  EnumWrapping:
    active: false
  FunctionExpressionBody:
    active: false
  FunctionSignature:
    active: false
  MaximumLineLength:
    active: false
  # Compose constants (Dp, Color, durations) use camelCase like the Compose APIs.
  PropertyName:
    active: false
  TrailingCommaOnCallSite:
    active: true
  TrailingCommaOnDeclarationSite:
    active: true

Compose:
  CompositionLocalAllowlist:
    allowedCompositionLocals:
      - LocalComposeWindow
      - LocalFeedFlowStrings
      - LocalReduceMotion
  UnnecessaryLaunchedEffect:
    # Focus must be requested after the node is attached, which a frame-deferred LaunchedEffect guarantees.
    allowedCallNames:
      - androidx.compose.ui.focus.FocusRequester.requestFocus
      - androidx.compose.ui.focus.FocusRequester.restoreFocusedChild
  # Renaming ~130 past-tense event lambdas (onXxxChanged -> onXxxChange) is pure churn for now.
  ParameterNaming:
    active: false
