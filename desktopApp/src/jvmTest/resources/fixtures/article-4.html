<body><article><h1>Build a Reading Habit That Fits</h1><p>Attach reading to an existing moment, such as the first cup of tea.</p><p>Keep a short list of <strong>interesting next reads</strong>.</p><p>A routine works best when it leaves room for curiosity.</p></article></body></html>
