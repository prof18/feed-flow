appId: com.prof18.feedflow.debug
---
- launchApp
- openLink: feedflow://e2e/reset-and-seed?profile=content-rich
- extendedWaitUntil:
    visible:
      id: e2e_seed_complete
    timeout: 15000
- tapOn:
    id: e2e_open_app
- tapOn:
    id: drawer_menu_button
- tapOn:
    id: drawer_settings_button
- scrollUntilVisible:
    element: "About & Support"
    direction: DOWN
    timeout: 10000
- tapOn: "About & Support"
- assertVisible: "Report issue"
- assertNotVisible: "Send anonymous crash reports"
- assertVisible: "About"
- tapOn: "About"
- assertVisible: "FeedFlow is a minimal RSS reader.*"
- assertVisible: "Open source licenses"
- back
- assertVisible: "Report issue"
- assertVisible: "About"
- assertNotVisible: "Send anonymous crash reports"
