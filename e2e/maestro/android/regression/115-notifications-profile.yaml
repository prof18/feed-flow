appId: com.prof18.feedflow.debug
---
- launchApp:
    permissions:
      notifications: allow
- openLink: feedflow://e2e/reset-and-seed?profile=notifications
- assertVisible: "E2E seed complete"
- tapOn:
    id: e2e_open_app
- tapOn:
    id: drawer_menu_button
- tapOn:
    id: drawer_settings_button
- scrollUntilVisible:
    element:
      id: settings_notifications
    direction: DOWN
    timeout: 10000
    centerElement: true
- tapOn:
    id: settings_notifications
- assertVisible:
    text: "Notifications"
- assertVisible:
    text: "Every 30 minutes"
- assertVisible:
    text: "By feed"
- tapOn:
    text: "Notification style"
- tapOn:
    text: "Per article"
- assertVisible:
    text: "Show a notification for each new article, with its title and image when available."
- back
- tapOn:
    id: settings_notifications
- assertVisible:
    text: "Per article"
- stopApp
- launchApp
- tapOn:
    id: drawer_menu_button
- tapOn:
    id: drawer_settings_button
- scrollUntilVisible:
    element:
      id: settings_notifications
    direction: DOWN
    timeout: 10000
    centerElement: true
- tapOn:
    id: settings_notifications
- assertVisible:
    text: "Per article"
- tapOn:
    text: "Notification style"
- tapOn:
    text: "By category"
- assertNotVisible:
    text: "Show a notification for each new article, with its title and image when available."
- assertVisible:
    text: "Enable all notifications"
- scrollUntilVisible:
    element:
      text: "Android Central RSS Feed"
    direction: DOWN
    timeout: 10000
- assertVisible:
    text: "Android Central RSS Feed"
- scrollUntilVisible:
    element:
      text: "Bloomberg Politics"
    direction: DOWN
    timeout: 10000
- assertVisible:
    text: "Bloomberg Politics"
- scrollUntilVisible:
    element:
      text: "Ars Technica"
    direction: DOWN
    timeout: 10000
- assertVisible:
    text: "Ars Technica"
- scrollUntilVisible:
    element:
      text: "Notification style"
    direction: UP
    timeout: 10000
- tapOn:
    text: "Notification style"
- tapOn:
    text: "By category"
- assertVisible:
    text: "By category"
