appId: com.prof18.feedflow.debug
---
- launchApp
- openLink: feedflow://e2e/reset-and-seed?profile=content-rich
- assertVisible: "E2E seed complete"
- tapOn:
    id: e2e_open_app
- tapOn:
    id: drawer_menu_button
- tapOn:
    id: drawer_settings_button
- scrollUntilVisible:
    element:
      id: settings_feed_list
    direction: DOWN
    timeout: 10000
    centerElement: true
- tapOn:
    id: settings_feed_list
- assertVisible: "Text scale"
- assertVisible: "Default"
- scrollUntilVisible:
    element: "Description"
    direction: DOWN
    timeout: 10000
    centerElement: true
- tapOn: "Description"
- assertVisible: "Turn on Description to change this."
- tapOn: "Description"
- assertNotVisible: "Turn on Description to change this."
- assertVisible: "Hide title from article description"
- tapOn: "Hide title from article description"
- tapOn: "Description lines"
- tapOn: "No limit"
- assertVisible: "No limit"
- scrollUntilVisible:
    element: "Unread indicator"
    direction: DOWN
    timeout: 10000
    centerElement: true
- tapOn: "Unread indicator"
- assertVisible: "Feed name"
- tapOn: "Feed name"
- assertVisible: "Date"
- tapOn: "Date"
- assertVisible: "Turn on Date to change this."
- tapOn: "Date"
- assertNotVisible: "Turn on Date to change this."
- scrollUntilVisible:
    element: "Date format"
    direction: DOWN
    timeout: 10000
    centerElement: true
- tapOn: "Date format"
- tapOn: "Year-Month-Day"
- assertVisible: "Year-Month-Day"
- scrollUntilVisible:
    element: "Time format"
    direction: DOWN
    timeout: 10000
- tapOn: "Time format"
- tapOn: "12 hours"
- assertVisible: "12 hours"
- scrollUntilVisible:
    element: "Swipe left"
    direction: DOWN
    timeout: 10000
- tapOn: "Swipe left"
- tapOn: "Mark as read or unread"
- assertVisible: "Mark as read or unread"
- tapOn: "Swipe right"
- tapOn: "Add or remove bookmark"
- assertVisible: "Add or remove bookmark"
