appId: com.prof18.feedflow.debug
---
- launchApp:
    permissions:
      notifications: allow
- openLink: feedflow://e2e/reset-and-seed?profile=notifications
- runFlow:
    when:
      visible: "Open with.*"
    commands:
      - runFlow:
          when:
            visible: "^FeedFlow$"
          commands:
            - tapOn: "^FeedFlow$"
      - tapOn: "Just once"
- assertVisible: "E2E seed complete"
- tapOn:
    id: e2e_open_app
- tapOn:
    id: drawer_menu_button
- tapOn:
    id: drawer_settings_button
- scrollUntilVisible:
    element:
      id: settings_notifications
    direction: DOWN
    timeout: 10000
    centerElement: true
- tapOn:
    id: settings_notifications
- assertVisible: "By feed"
- tapOn: "Notification style"
- tapOn: "Per article"
- assertVisible: "Show a notification for each new article, with its title and image when available."
- back
- tapOn:
    id: settings_notifications
- assertVisible: "Per article"
- stopApp
- launchApp
- tapOn:
    id: drawer_menu_button
- tapOn:
    id: drawer_settings_button
- scrollUntilVisible:
    element:
      id: settings_notifications
    direction: DOWN
    timeout: 10000
    centerElement: true
- tapOn:
    id: settings_notifications
- assertVisible: "Per article"
- tapOn: "Notification style"
- tapOn: "All combined"
- assertNotVisible: "Show a notification for each new article, with its title and image when available."
- assertVisible:
    id: notifications_background_refresh
- assertVisible: "Every 30 minutes"
- tapOn: "Background refresh"
- tapOn: "Never"
- assertVisible: "Off, so notifications can't arrive"
- tapOn: "Background refresh"
- tapOn: "Every 2 hours"
- assertNotVisible: "Off, so notifications can't arrive"
- assertVisible: "Every 2 hours"
- tapOn: "Background refresh"
- tapOn: "Never"
- assertVisible: "Off, so notifications can't arrive"
- tapOn:
    childOf:
      id: notifications_enable_all
    rightOf:
      text: "Enable all notifications"
    checked: false
- assertVisible: "Every hour"
- tapOn:
    childOf:
      id: notifications_enable_all
    rightOf:
      text: "Enable all notifications"
    checked: true
- scrollUntilVisible:
    element: "Android Central RSS Feed"
    direction: DOWN
    timeout: 10000
- tapOn:
    childOf:
      id: notifications_feed_e2e-feed-android-weekly
    rightOf:
      text: "Android Central RSS Feed"
    checked: false
- assertVisible:
    childOf:
      id: notifications_feed_e2e-feed-android-weekly
    rightOf:
      text: "Android Central RSS Feed"
    checked: true
