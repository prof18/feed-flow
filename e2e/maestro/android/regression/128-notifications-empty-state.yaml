appId: com.prof18.feedflow.debug
---
- launchApp:
    permissions:
      notifications: allow
- openLink: feedflow://e2e/reset-and-seed?profile=empty
- assertVisible: "E2E seed complete"
- tapOn:
    id: e2e_open_app
- tapOn:
    id: drawer_menu_button
- tapOn:
    id: drawer_settings_button
- scrollUntilVisible:
    element:
      id: settings_notifications
    direction: DOWN
    timeout: 10000
    centerElement: true
- tapOn:
    id: settings_notifications
- assertVisible: "Looks like you haven't added any feeds yet.*"
