appId: com.prof18.feedflow.debug
---
- launchApp:
    permissions:
      notifications: allow
- openLink: feedflow://e2e/reset-and-seed?profile=notifications
- assertVisible: "E2E seed complete"
- tapOn:
    id: e2e_open_app
- tapOn:
    id: drawer_menu_button
- tapOn:
    id: drawer_settings_button
- tapOn:
    id: settings_feeds_accounts
- tapOn: "Add feed"
- assertVisible:
    id: add_feed_url_input
- assertNotVisible:
    id: add_feed_hide_youtube_shorts
- tapOn:
    id: add_feed_url_input
- inputText: "https://www.youtube.com/@mkbhd"
- hideKeyboard
- assertVisible:
    id: add_feed_url_input
    text: "https://www.youtube.com/@mkbhd"
- assertVisible:
    id: add_feed_hide_youtube_shorts
    checked: false
- assertVisible:
    text: "Hide Shorts"
    childOf:
      id: add_feed_hide_youtube_shorts
- tapOn:
    id: add_feed_hide_youtube_shorts
- assertVisible:
    id: add_feed_hide_youtube_shorts
    checked: true
- assertVisible: "Only regular videos from this channel will be included. Shorts and live streams are excluded."
- longPressOn:
    id: add_feed_url_input
- inputText: "https://example.com/rss.xml"
- hideKeyboard
- assertVisible:
    id: add_feed_url_input
    text: "https://example.com/rss.xml"
- assertNotVisible:
    id: add_feed_hide_youtube_shorts
- longPressOn:
    id: add_feed_url_input
- inputText: "https://www.youtube.com/@mkbhd"
- hideKeyboard
- assertVisible:
    id: add_feed_url_input
    text: "https://www.youtube.com/@mkbhd"
- assertVisible:
    id: add_feed_hide_youtube_shorts
    checked: false
- assertVisible:
    text: "Hide Shorts"
    childOf:
      id: add_feed_hide_youtube_shorts
- tapOn:
    id: add_feed_hide_youtube_shorts
- assertVisible:
    id: add_feed_hide_youtube_shorts
    checked: true
- back
- tapOn: "Add feed"
- assertNotVisible:
    id: add_feed_hide_youtube_shorts
- tapOn:
    id: add_feed_url_input
- inputText: "https://www.youtube.com/@mkbhd"
- hideKeyboard
- assertVisible:
    id: add_feed_url_input
    text: "https://www.youtube.com/@mkbhd"
- assertVisible:
    id: add_feed_hide_youtube_shorts
    checked: false
- assertVisible:
    text: "Hide Shorts"
    childOf:
      id: add_feed_hide_youtube_shorts
- tapOn:
    id: edit_feed_category_selector
- assertVisible: "Categories"
- tapOn: "News"
- tapOn: "Save"
- assertVisible: "News"
- assertVisible: "Enable notifications for new articles"
- tapOn: "Enable notifications for new articles"
