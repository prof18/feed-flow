appId: com.prof18.feedflow.debug
---
- launchApp
- openLink: feedflow://e2e/reset-and-seed?profile=content-rich
- assertVisible: "E2E seed complete"
- tapOn:
    id: e2e_open_app
- tapOn:
    id: drawer_menu_button
- scrollUntilVisible:
    element:
      id: drawer_category_expand_e2e_category_technology
    direction: DOWN
    timeout: 10000
- tapOn:
    id: drawer_category_expand_e2e_category_technology
- scrollUntilVisible:
    element:
      id: drawer_feed_source_e2e_feed_android_weekly
    direction: DOWN
    timeout: 10000
- tapOn:
    id: drawer_feed_source_e2e_feed_android_weekly
- assertVisible:
    text: "Android Central RSS Feed"
- tapOn:
    id: home_more_menu_button
- assertVisible: "Feed settings"
- tapOn: "Feed settings"
- assertVisible: "Feed settings"
- assertVisible: "Open articles in"
- tapOn: "Open articles in"
- tapOn:
    id: article_open_mode_full_article
- assertVisible: "Reader \\(website\\)"
- tapOn:
    id: edit_feed_save
- extendedWaitUntil:
    visible: "Android Central RSS Feed"
    timeout: 10000
- tapOn:
    id: home_more_menu_button
- tapOn: "Feed settings"
- assertVisible: "Reader \\(website\\)"
