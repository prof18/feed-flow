appId: com.prof18.feedflow.debug
---
- launchApp
- openLink: feedflow://e2e/reset-and-seed?profile=content-rich
- assertVisible: "E2E seed complete"
- tapOn:
    id: e2e_open_app
- tapOn:
    id: drawer_menu_button
- tapOn:
    id: drawer_settings_button
- scrollUntilVisible:
    element:
      id: settings_reading_behavior
    direction: DOWN
    timeout: 10000
    centerElement: true
- tapOn:
    id: settings_reading_behavior
- assertVisible: "In-app browser"
- assertVisible: "Reader (website)"
- tapOn: "Open other links in"
- assertNotVisible: "Calculator"
- tapOn: "Default browser"
- assertVisible: "Default browser"
- tapOn:
    id: reading_behavior_article_open_mode
- assertVisible: "In-app browser"
- tapOn: "Chrome"
- assertVisible: "Chrome"
- assertNotVisible: "Reader (website)"
- back
- back
- tapOn:
    id: drawer_timeline
    optional: true
- launchApp
- tapOn:
    id: drawer_menu_button
- tapOn:
    id: drawer_settings_button
- scrollUntilVisible:
    element:
      id: settings_reading_behavior
    direction: DOWN
    timeout: 10000
    centerElement: true
- tapOn:
    id: settings_reading_behavior
- assertVisible: "Chrome"
- assertVisible: "Default browser"
- assertNotVisible: "Reader (website)"
