appId: com.prof18.feedflow.debug
---
- launchApp
- openLink: feedflow://e2e/reset-and-seed?profile=reader-mode
- extendedWaitUntil:
    visible:
      id: e2e_seed_complete
    timeout: 15000
- tapOn:
    id: e2e_open_app
- scrollUntilVisible:
    element:
      id: article_row_e2e_article_reader_success
    direction: DOWN
    timeout: 10000
- tapOn:
    id: article_row_e2e_article_reader_success
- assertVisible: "E2E cached reader content loaded from the seed fixture."
- tapOn:
    id: reader_more_menu_button
- tapOn:
    text: "Content from the feed"
- extendedWaitUntil:
    visible: "This article ships no link at all.*"
    timeout: 5000
- tapOn:
    id: reader_back_button
- assertVisible:
    id: article_row_e2e_article_reader_success
- assertNotVisible:
    id: reader_article_e2e_article_reader_success
