appId: com.prof18.feedflow.debug
---
- launchApp
- openLink: feedflow://e2e/reset-and-seed?profile=audio-episode&audioUrl=${AUDIO_URL}
- extendedWaitUntil:
    visible:
      id: e2e_seed_complete
    timeout: 15000
- tapOn:
    id: e2e_open_app
- tapOn:
    id: article_row_e2e_audio_episode
- assertVisible:
    text: "^Play audio: E2E Audio Episode: Language Notes$"
- tapOn:
    text: "^Play audio: E2E Audio Episode: Language Notes$"
- extendedWaitUntil:
    visible:
      id: audio_player
    timeout: 10000
- assertVisible:
    id: audio_pause
- pressKey: Home
- swipe:
    start: 50%, 0%
    end: 50%, 60%
    duration: 500
- extendedWaitUntil:
    visible:
      id: com.android.systemui:id/actionPlayPause
    timeout: 10000
- takeScreenshot: .tmp/audio-playback/android-media-notification
- tapOn:
    id: com.android.systemui:id/actionPlayPause
- pressKey: Back
- launchApp:
    stopApp: false
- assertVisible:
    id: audio_play
- tapOn:
    id: audio_speed
- tapOn:
    id: audio_speed_1.5
- assertVisible:
    text: "^1.5×$"
- tapOn:
    id: audio_speed
- tapOn:
    id: audio_speed_1
- assertVisible:
    text: "^1×$"
- assertVisible:
    id: audio_play
- tapOn:
    id: audio_play
- assertVisible:
    id: audio_pause
- tapOn:
    id: audio_pause
- assertVisible:
    id: audio_play
- tapOn:
    id: audio_play
- assertVisible:
    id: audio_pause
- tapOn:
    id: audio_pause
- assertVisible:
    id: audio_play
- tapOn:
    id: reader_more_menu_button
- assertVisible:
    id: reader_font_size_button
- takeScreenshot: .tmp/audio-playback/android-audio-reader-menu
- pressKey: Back
- assertVisible:
    id: audio_play
- tapOn:
    id: audio_seek
- assertVisible:
    id: audio_position
    text: "^0:[2-4][0-9]$"
- takeScreenshot: .tmp/audio-playback/android-audio-dock
- tapOn:
    id: audio_close_player
- assertNotVisible:
    id: audio_player
- tapOn:
    text: "^Play audio: E2E Audio Episode: Language Notes$"
- assertVisible:
    id: audio_player
- assertVisible:
    id: audio_pause
- assertVisible:
    id: audio_position
    text: "^0:[2-4][0-9]$"
- tapOn:
    id: reader_next_button
- extendedWaitUntil:
    visible:
      id: reader_article_e2e_audio_control
    timeout: 5000
- assertVisible:
    id: audio_player
- assertVisible:
    id: audio_pause
- assertVisible:
    id: audio_position
    text: "^0:[2-4][0-9]$"
- tapOn:
    id: audio_close_player
- assertNotVisible:
    id: audio_player
