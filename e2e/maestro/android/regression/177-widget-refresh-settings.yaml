appId: com.prof18.feedflow.debug
env:
  WIDGET_HEADER_TITLE: ${WIDGET_HEADER_TITLE || "Show header title"}
---
- launchApp
- openLink: feedflow://e2e/reset-and-seed?profile=android-widget
- extendedWaitUntil:
    visible:
      id: e2e_seed_complete
    timeout: 60000
- tapOn:
    id: e2e_open_widget_settings
- assertVisible:
    rightOf:
      text: "Show refresh button"
    checked: false
- tapOn: "Show refresh button"
- assertVisible:
    rightOf:
      text: "Show refresh button"
    checked: true
- tapOn: ${WIDGET_HEADER_TITLE}
- assertVisible:
    rightOf:
      text: ${WIDGET_HEADER_TITLE}
    checked: false
- back
- tapOn:
    id: e2e_open_widget_settings
- assertVisible:
    rightOf:
      text: "Show refresh button"
    checked: true
- assertVisible:
    rightOf:
      text: ${WIDGET_HEADER_TITLE}
    checked: false
- tapOn: "Show refresh button"
- assertVisible:
    rightOf:
      text: "Show refresh button"
    checked: false
