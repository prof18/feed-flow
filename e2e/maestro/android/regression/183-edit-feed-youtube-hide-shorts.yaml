appId: com.prof18.feedflow.debug
---
- launchApp:
    permissions:
      notifications: allow
- openLink: feedflow://e2e/reset-and-seed?profile=notifications
- assertVisible: "E2E seed complete"
- tapOn:
    id: e2e_open_app
- longPressOn:
    id: article_row_e2e_article_newest_unread
- tapOn: "Feed settings"
- assertVisible: "Feed settings"
- assertNotVisible:
    id: edit_feed_hide_youtube_shorts_toggle
- tapOn:
    id: edit_feed_url_input
    point: "95%,50%"
- eraseText: 200
- inputText: "https://www.youtube.com/feeds/videos.xml?channel_id=UCsBjURrPoezykLs9EqgamOA"
- hideKeyboard
- scrollUntilVisible:
    element:
      id: edit_feed_hide_youtube_shorts_toggle
    direction: DOWN
    timeout: 10000
- assertVisible:
    id: edit_feed_hide_youtube_shorts_toggle
    checked: false
- tapOn:
    id: edit_feed_hide_youtube_shorts_toggle
- assertVisible:
    id: edit_feed_hide_youtube_shorts_toggle
    checked: true
- scrollUntilVisible:
    element:
      id: edit_feed_url_input
    direction: UP
    timeout: 10000
- assertVisible:
    id: edit_feed_url_input
    text: ".*playlist_id=UULFsBjURrPoezykLs9EqgamOA.*"
- scrollUntilVisible:
    element:
      id: edit_feed_hide_youtube_shorts_toggle
    direction: DOWN
    timeout: 10000
- tapOn:
    id: edit_feed_hide_youtube_shorts_toggle
- assertVisible:
    id: edit_feed_hide_youtube_shorts_toggle
    checked: false
- scrollUntilVisible:
    element:
      id: edit_feed_url_input
    direction: UP
    timeout: 10000
- assertVisible:
    id: edit_feed_url_input
    text: ".*channel_id=UCsBjURrPoezykLs9EqgamOA.*"
