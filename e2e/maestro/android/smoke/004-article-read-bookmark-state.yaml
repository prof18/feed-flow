appId: com.prof18.feedflow.debug
---
- launchApp
- openLink: feedflow://e2e/reset-and-seed?profile=content-rich
- extendedWaitUntil:
    visible:
      id: e2e_seed_complete
    timeout: 30000
- tapOn:
    id: e2e_open_app
- scrollUntilVisible:
    element:
      id: article_row_e2e_article_reader_success
    direction: DOWN
    timeout: 10000
    visibilityPercentage: 60
    centerElement: true
- tapOn:
    id: article_row_e2e_article_reader_success
- assertVisible:
    id: reader_bookmark_button
- tapOn:
    id: reader_bookmark_button
- assertVisible: "Remove from bookmarks"
- tapOn:
    id: reader_bookmark_button
- assertVisible: "Are you sure you want to remove this article from Bookmarks?"
- tapOn: "Cancel"
- assertVisible: "Remove from bookmarks"
- tapOn:
    id: reader_bookmark_button
- assertVisible: "Are you sure you want to remove this article from Bookmarks?"
- tapOn: "Confirm"
- assertVisible: "Add to bookmarks"
- tapOn:
    id: reader_bookmark_button
- assertVisible: "Remove from bookmarks"
- tapOn:
    id: reader_back_button
- tapOn:
    id: drawer_menu_button
- tapOn:
    id: drawer_bookmarks
- scrollUntilVisible:
    element:
      text: "E2E Reader Mode Success Article.*"
    direction: DOWN
    timeout: 10000
- tapOn:
    id: drawer_menu_button
- tapOn:
    id: drawer_read
- scrollUntilVisible:
    element:
      text: "E2E Reader Mode Success Article.*"
    direction: DOWN
    timeout: 10000
