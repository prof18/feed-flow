appId: com.prof18.feedflow.debug
---
- launchApp
- openLink: feedflow://e2e/reset-and-seed?profile=content-rich
- assertVisible: "E2E seed complete"
- tapOn:
    id: e2e_open_app
- tapOn:
    id: drawer_menu_button
- tapOn:
    id: drawer_settings_button
- scrollUntilVisible:
    element:
      id: settings_reading_behavior
    direction: DOWN
    timeout: 10000
    centerElement: true
- tapOn:
    id: settings_reading_behavior
- tapOn:
    id: reading_behavior_article_open_mode
- tapOn:
    id: article_open_mode_feed_content
# "Mark as read when scrolling" is on: Hide right away stays listed but disabled, with the reason shown.
- assertVisible: "Hide right away is off while.*articles stay in place as you scroll.*"
- tapOn:
    id: reading_behavior_read_articles
- assertVisible:
    id: reading_behavior_read_articles_hide_right_away
    enabled: false
- tapOn:
    id: reading_behavior_read_articles_hide_right_away
- assertVisible:
    id: reading_behavior_read_articles_hide_right_away
- tapOn: "Keep in list"
- assertVisible: "Keep in list"
- tapOn:
    id: settings_back_button
- tapOn:
    id: settings_back_button
- tapOn:
    id: drawer_timeline
    optional: true
- assertVisible:
    text: "E2E Read Article.*"
- launchApp
- assertVisible:
    text: "E2E Read Article.*"
- tapOn:
    id: drawer_menu_button
- tapOn:
    id: drawer_settings_button
- scrollUntilVisible:
    element:
      id: settings_reading_behavior
    direction: DOWN
    timeout: 10000
    centerElement: true
- tapOn:
    id: settings_reading_behavior
- assertVisible: "Keep in list"
- tapOn: "Mark as read when scrolling"
- assertVisible: "Choose when articles you have read leave your lists\\."
- tapOn:
    id: reading_behavior_read_articles
- tapOn: "Hide right away"
- assertVisible: "Hide right away"
- tapOn:
    id: settings_back_button
- tapOn:
    id: settings_back_button
- tapOn:
    id: drawer_timeline
    optional: true
- assertNotVisible:
    text: "E2E Read Article.*"
- scrollUntilVisible:
    element:
      id: article_row_e2e_article_reader_success
    direction: DOWN
    timeout: 10000
- tapOn:
    id: article_row_e2e_article_reader_success
- assertVisible:
    id: reader_article_e2e_article_reader_success
- tapOn:
    id: reader_back_button
- assertNotVisible:
    id: article_row_e2e_article_reader_success
- stopApp
- launchApp
- tapOn:
    id: drawer_menu_button
- tapOn:
    id: drawer_settings_button
- scrollUntilVisible:
    element:
      id: settings_reading_behavior
    direction: DOWN
    timeout: 10000
    centerElement: true
- tapOn:
    id: settings_reading_behavior
- assertVisible: "Hide right away"
