appId: com.prof18.feedflow.dev
---
- launchApp
- openLink: feedflow://e2e/reset-and-seed?profile=content-rich
- tapOn:
    text: "^Open$"
    optional: true
- assertVisible:
    id: e2e_seed_complete
- tapOn:
    id: drawer_menu_button
- tapOn:
    id: drawer_settings_button
- tapOn:
    id: settings_feeds_accounts
- tapOn:
    text: "Add feed"
- tapOn:
    id: edit_feed_category_selector
- assertVisible: "Categories"
- tapOn:
    id: edit_feed_category_sheet_add
- tapOn:
    id: edit_feed_category_add_input
- inputText: "Technology"
- assertVisible: "A category with this name already exists"
- assertVisible:
    id: edit_feed_category_add_confirm
    enabled: false
# Focusing the field raises the keyboard and moves the add sheet from its medium to its large
# detent. A tap aimed from a hierarchy read mid-move hits the button's old position and misses,
# so repeat it until the sheet is gone.
- retry:
    maxRetries: 3
    commands:
      - waitForAnimationToEnd
      - tapOn:
          id: edit_feed_category_add_close
      - assertNotVisible:
          id: edit_feed_category_add_input
- tapOn:
    id: edit_feed_category_sheet_add
- tapOn:
    id: edit_feed_category_add_input
- inputText: "E2E Created Category"
- tapOn:
    id: edit_feed_category_add_confirm
- assertVisible: "E2E Created Category"
