appId: com.prof18.feedflow.dev
---
- launchApp
- openLink: feedflow://e2e/reset-and-seed?profile=content-rich
- tapOn:
    text: "^Open$"
    optional: true
- assertVisible:
    id: e2e_seed_complete
- tapOn:
    id: drawer_menu_button
- longPressOn:
    id: drawer_category_e2e_category_technology
- tapOn:
    id: drawer_category_menu_rename
- tapOn:
    id: edit_feed_category_rename_input
- eraseText: 100
- inputText: "E2E Renamed Category"
# The keyboard moves the rename sheet to its large detent and its content shifts after typing.
# A tap aimed from a hierarchy read before the layout settles hits the button's old position and
# misses, so repeat it until the sheet is gone.
- retry:
    maxRetries: 3
    commands:
      - waitForAnimationToEnd
      - tapOn:
          id: edit_feed_category_rename_save
      - assertNotVisible:
          id: edit_feed_category_rename_input
- assertVisible: "E2E Renamed Category"
- longPressOn:
    id: drawer_category_e2e_category_technology
- tapOn:
    id: drawer_category_menu_delete_all_feeds
- tapOn:
    text: "Confirm"
- assertNotVisible: "Android Central RSS Feed"
