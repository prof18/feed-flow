appId: com.prof18.feedflow.dev
---
- launchApp
- openLink: feedflow://e2e/reset-and-seed?profile=content-rich
- tapOn:
    text: "^Open$"
    optional: true
- assertVisible:
    id: e2e_seed_complete
- tapOn:
    id: drawer_menu_button
- tapOn:
    id: drawer_settings_button
- scrollUntilVisible:
    element:
      id: settings_sync
    direction: DOWN
    timeout: 10000
- tapOn:
    id: settings_sync
- assertVisible:
    id: sync_storage_refresh_on_launch
- tapOn:
    id: sync_storage_refresh_on_launch
- tapOn:
    id: BackButton
- scrollUntilVisible:
    element:
      id: settings_storage
    direction: DOWN
    timeout: 10000
- tapOn:
    id: settings_storage
- tapOn:
    id: sync_storage_auto_delete
- assertVisible: "One month old"
- tapOn: "One week old"
- scrollUntilVisible:
    element:
      id: storage_save_content
    direction: DOWN
    timeout: 10000
- tapOn:
    id: storage_save_content
    point: "90%,50%"
- tapOn:
    id: storage_prefetch_content
    point: "90%,50%"
- assertVisible: "Enabling this option makes refreshing feeds slower and uses more data.*"
- tapOn: "Confirm"
- tapOn:
    id: sync_storage_clear_downloaded
- assertVisible: "Delete offline copies?"
- tapOn: "Cancel"
