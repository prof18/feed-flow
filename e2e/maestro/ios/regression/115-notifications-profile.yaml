appId: com.prof18.feedflow.dev
---
- launchApp:
    permissions:
      notifications: allow
- openLink: feedflow://e2e/reset-and-seed?profile=notifications
- tapOn:
    text: "^Open$"
    optional: true
- assertVisible:
    id: e2e_seed_complete
- tapOn:
    id: drawer_menu_button
- tapOn:
    id: drawer_settings_button
- scrollUntilVisible:
    element:
      id: settings_notifications
    direction: DOWN
    timeout: 10000
- tapOn:
    id: settings_notifications
- assertVisible:
    text: "Notifications"
- tapOn:
    text: "Allow notifications"
    optional: true
- tapOn:
    text: "Allow"
    optional: true
- extendedWaitUntil:
    visible:
      text: "Enable all notifications"
    timeout: 10000
- assertVisible:
    text: "By feed"
- tapOn:
    text: "Notification style"
- tapOn:
    text: "Per article"
- assertVisible:
    text: "Show article titles and available images. Each refresh shows up to 20 articles, plus a summary of the rest."
- tapOn:
    id: BackButton
- tapOn:
    id: settings_notifications
- assertVisible:
    text: "Per article"
- stopApp
- launchApp
- tapOn:
    id: drawer_menu_button
- tapOn:
    id: drawer_settings_button
- scrollUntilVisible:
    element:
      id: settings_notifications
    direction: DOWN
    timeout: 10000
- tapOn:
    id: settings_notifications
- assertVisible:
    text: "Per article"
- tapOn:
    text: "Notification style"
- tapOn:
    text: "By category"
- assertNotVisible:
    text: "Show article titles and available images. Each refresh shows up to 20 articles, plus a summary of the rest."
- assertVisible:
    text: "Enable all notifications"
- scrollUntilVisible:
    element:
      text: "Bloomberg Technology"
    direction: DOWN
    timeout: 10000
- scrollUntilVisible:
    element:
      text: "Android Central RSS Feed"
    direction: DOWN
    timeout: 10000
- scrollUntilVisible:
    element:
      text: "Ars Technica"
    direction: DOWN
    timeout: 10000
- scrollUntilVisible:
    element:
      text: "Notification style"
    direction: UP
    timeout: 10000
- tapOn:
    text: "Notification style"
- tapOn:
    text: "By category"
- assertVisible:
    text: "By category"
