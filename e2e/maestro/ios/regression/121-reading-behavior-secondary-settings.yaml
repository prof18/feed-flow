appId: com.prof18.feedflow.dev
---
- launchApp
- openLink: feedflow://e2e/reset-and-seed?profile=content-rich
- tapOn:
    text: "^Open$"
    optional: true
- assertVisible:
    id: e2e_seed_complete
- tapOn:
    id: drawer_menu_button
- tapOn:
    id: drawer_settings_button
- scrollUntilVisible:
    element:
      id: settings_reading_behavior
    direction: DOWN
    timeout: 10000
- tapOn:
    id: settings_reading_behavior
- assertVisible: "Open articles in"
- assertVisible: "Open other links in"
- assertVisible: "Mark as read when scrolling"
- assertNotVisible: "Keep articles you open offline"
- tapOn:
    id: reading_behavior_mark_read_when_scrolling
    point: "90%,50%"
