appId: com.prof18.feedflow.dev
---
- launchApp:
    permissions:
      notifications: allow
- openLink: feedflow://e2e/reset-and-seed?profile=notifications
- tapOn:
    text: "^Open$"
    optional: true
- extendedWaitUntil:
    visible:
      id: e2e_seed_complete
    timeout: 10000
- tapOn:
    id: drawer_menu_button
- tapOn:
    id: drawer_settings_button
- scrollUntilVisible:
    element:
      id: settings_notifications
    direction: DOWN
    timeout: 10000
- tapOn:
    id: settings_notifications
- tapOn:
    text: "Allow notifications"
    optional: true
- tapOn:
    text: "Allow"
    optional: true
- extendedWaitUntil:
    visible: "Enable all notifications"
    timeout: 10000
- assertVisible: "By feed"
- tapOn: "Notification style"
- tapOn: "Per article"
- assertVisible: "Show article titles and available images. Each refresh shows up to 20 articles, plus a summary of the rest."
- tapOn:
    id: BackButton
- tapOn:
    id: settings_notifications
- assertVisible: "Per article"
- stopApp
- launchApp
- tapOn:
    id: drawer_menu_button
- tapOn:
    id: drawer_settings_button
- scrollUntilVisible:
    element:
      id: settings_notifications
    direction: DOWN
    timeout: 10000
- tapOn:
    id: settings_notifications
- assertVisible: "Per article"
- tapOn: "Notification style"
- tapOn: "All combined"
- assertNotVisible: "Show article titles and available images. Each refresh shows up to 20 articles, plus a summary of the rest."
- tapOn: "Enable all notifications"
- scrollUntilVisible:
    element:
      text: "(?i)technology"
    direction: DOWN
    timeout: 10000
- tapOn: "Search feeds"
- inputText: "Central"
- extendedWaitUntil:
    visible: "Android Central RSS Feed"
    timeout: 5000
- assertNotVisible: "VeneziaToday"
- eraseText: 20
- scrollUntilVisible:
    element:
      text: "VeneziaToday"
    direction: UP
    timeout: 10000
- scrollUntilVisible:
    element:
      text: "Android Central RSS Feed"
    direction: DOWN
    timeout: 10000
- tapOn: "Android Central RSS Feed"
- scrollUntilVisible:
    element:
      text: "Notification style"
    direction: UP
    timeout: 10000
- tapOn: "Notification style"
- tapOn: "All combined"
- assertVisible: "All combined"
