appId: com.prof18.feedflow.dev
---
- launchApp:
    permissions:
      notifications: allow
- openLink: feedflow://e2e/reset-and-seed?profile=empty
- tapOn:
    text: "^Open$"
    optional: true
- assertVisible:
    id: e2e_seed_complete
- tapOn:
    id: drawer_menu_button
- tapOn:
    id: drawer_settings_button
- scrollUntilVisible:
    element:
      id: settings_notifications
    direction: DOWN
    timeout: 10000
- tapOn:
    id: settings_notifications
- tapOn:
    text: "Allow notifications"
    optional: true
- tapOn:
    text: "Allow"
    optional: true
- assertVisible: "Looks like you haven't added any feeds yet.*"
