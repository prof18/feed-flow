appId: com.prof18.feedflow.dev
---
- launchApp:
    permissions:
      notifications: allow
- openLink: feedflow://e2e/reset-and-seed?profile=notifications
- tapOn:
    text: "^Open$"
    optional: true
- assertVisible:
    id: e2e_seed_complete
- tapOn:
    id: drawer_menu_button
- tapOn:
    id: drawer_settings_button
- scrollUntilVisible:
    element:
      id: settings_notifications
    direction: DOWN
    timeout: 10000
- tapOn:
    id: settings_notifications
- tapOn:
    text: "Allow notifications"
    optional: true
- tapOn:
    text: "Allow"
    optional: true
- extendedWaitUntil:
    visible: "Enable all notifications"
    timeout: 10000
- tapOn: "Enable all notifications"
- tapOn: "Enable all notifications"
- tapOn:
    id: BackButton
- tapOn:
    id: settings_done_button
- tapOn:
    id: drawer_timeline
    optional: true
- longPressOn:
    id: article_row_e2e_article_newest_unread
- tapOn: "Feed settings"
- assertVisible: "Feed settings"
- assertVisible: "Open articles in"
- tapOn: "Same as app setting"
- tapOn: "Article from the website"
- assertVisible: "Article from the website"
- scrollUntilVisible:
    element: "Enable notifications for new articles"
    direction: DOWN
    timeout: 10000
- tapOn: "Enable notifications for new articles"
- tapOn:
    id: edit_feed_done
- extendedWaitUntil:
    visible: "Timeline"
    timeout: 10000
