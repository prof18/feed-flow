appId: com.prof18.feedflow.dev
---
- launchApp:
    permissions:
      notifications: allow
- openLink: feedflow://e2e/reset-and-seed?profile=notifications
- tapOn:
    text: "^Open$"
    optional: true
- assertVisible:
    id: e2e_seed_complete
- tapOn:
    id: drawer_menu_button
- tapOn:
    id: drawer_settings_button
- tapOn:
    id: settings_feeds_accounts
- tapOn: "Add feed"
- assertVisible:
    id: add_feed_url_input
- assertNotVisible:
    id: add_feed_hide_youtube_shorts
- tapOn:
    id: add_feed_url_input
- inputText: "https://www.youtube.com/@mkbhd"
- assertVisible:
    id: add_feed_url_input
    text: "https://www.youtube.com/@mkbhd"
- assertVisible:
    id: add_feed_hide_youtube_shorts
    checked: false
- tapOn:
    id: add_feed_hide_youtube_shorts
    point: "90%,50%"
- assertVisible:
    id: add_feed_hide_youtube_shorts
    checked: true
- assertVisible: "Only regular videos from this channel will be included. Shorts and live streams are excluded."
- tapOn:
    id: add_feed_url_input
    point: "95%,50%"
- eraseText: 100
- inputText: "https://example.com/rss.xml"
- assertVisible:
    id: add_feed_url_input
    text: "https://example.com/rss.xml"
- assertNotVisible:
    id: add_feed_hide_youtube_shorts
- tapOn:
    id: add_feed_url_input
    point: "95%,50%"
- eraseText: 100
- inputText: "https://www.youtube.com/@mkbhd"
- assertVisible:
    id: add_feed_url_input
    text: "https://www.youtube.com/@mkbhd"
- assertVisible:
    id: add_feed_hide_youtube_shorts
    checked: false
- tapOn:
    id: add_feed_hide_youtube_shorts
    point: "90%,50%"
- assertVisible:
    id: add_feed_hide_youtube_shorts
    checked: true
- tapOn: "Feeds & Accounts"
- tapOn: "Add feed"
- assertNotVisible:
    id: add_feed_hide_youtube_shorts
- tapOn:
    id: add_feed_url_input
- inputText: "https://www.youtube.com/@mkbhd"
- assertVisible:
    id: add_feed_url_input
    text: "https://www.youtube.com/@mkbhd"
- assertVisible:
    id: add_feed_hide_youtube_shorts
    checked: false
- tapOn:
    id: edit_feed_category_selector
- assertVisible: "Categories"
- tapOn: "News"
- tapOn: "Save"
- assertVisible: "News"
- assertVisible: "Enable notifications for new articles"
- tapOn: "Enable notifications for new articles"
