appId: com.prof18.feedflow.dev
---
- launchApp
- openLink: feedflow://e2e/reset-and-seed?profile=reader-mode
- tapOn:
    text: "^Open$"
    optional: true
- assertVisible:
    id: e2e_seed_complete
- scrollUntilVisible:
    element:
      id: article_row_e2e_article_reader_success
    direction: DOWN
    timeout: 10000
- tapOn:
    id: article_row_e2e_article_reader_success
- assertVisible: "E2E cached reader content loaded from the seed fixture."
- tapOn:
    id: reader_more_menu_button
- tapOn:
    id: reader_content_source_button
- extendedWaitUntil:
    visible: "This article ships no link at all.*"
    timeout: 5000
# Switching the data source reloads the article in place and must not add a navigation entry.
- swipe:
    start: 2%, 50%
    end: 90%, 50%
    duration: 500
- assertVisible:
    id: article_row_e2e_article_reader_success
