appId: com.prof18.feedflow.dev
---
- launchApp
- openLink: feedflow://e2e/reset-and-seed?profile=reader-mode
- tapOn:
    text: "^Open$"
    optional: true
- assertVisible:
    id: e2e_seed_complete
- scrollUntilVisible:
    element:
      id: article_row_e2e_article_reader_long
    direction: DOWN
    timeout: 10000
- tapOn:
    id: article_row_e2e_article_reader_long
- extendedWaitUntil:
    visible: "E2E long reader head anchor."
    timeout: 10000
- scrollUntilVisible:
    element:
      text: "E2E long reader tail anchor."
    direction: DOWN
    speed: 80
    timeout: 30000
- assertNotVisible: "E2E long reader head anchor."
# Backgrounding makes iOS render the app-switcher snapshot in both appearances, which flips
# the SwiftUI color scheme twice. Reader styling must be applied to the loaded document instead
# of reloading it, or the article jumps back to the top on every return to the foreground.
- pressKey: Home
- launchApp:
    stopApp: false
- assertVisible: "E2E long reader tail anchor."
- assertNotVisible: "E2E long reader head anchor."
