appId: com.prof18.feedflow.dev
---
- launchApp
- openLink: feedflow://e2e/reset-and-seed?profile=content-rich
- tapOn:
    text: "^Open$"
    optional: true
- assertVisible:
    id: e2e_seed_complete
- tapOn:
    id: drawer_menu_button
- tapOn:
    id: drawer_settings_button
- scrollUntilVisible:
    element:
      id: settings_reading_behavior
    direction: DOWN
    timeout: 10000
- tapOn:
    id: settings_reading_behavior
- tapOn:
    id: reading_behavior_article_open_mode
- tapOn:
    id: article_open_mode_feed_content
- assertVisible: ".*Reader \\(feed\\)"
# "Mark as read when scrolling" is on: Hide right away stays listed but cannot be selected.
- scrollUntilVisible:
    element:
      id: reading_behavior_read_articles
    direction: DOWN
    timeout: 10000
- tapOn:
    id: reading_behavior_read_articles
- assertVisible: "Unavailable while.*articles stay in place as you scroll.*"
- assertVisible:
    id: reading_behavior_read_articles_hide_right_away
    enabled: false
- tapOn:
    id: reading_behavior_read_articles_hide_right_away
- assertNotVisible:
    id: reading_behavior_read_articles_hide_right_away
    selected: true
- tapOn:
    id: reading_behavior_read_articles_keep
- assertVisible: ".*Read articles.*Keep in list.*"
- tapOn:
    id: BackButton
- tapOn:
    id: settings_done_button
- tapOn:
    id: drawer_timeline
    optional: true
- assertVisible:
    text: "E2E Read Article.*"
- launchApp
- assertVisible:
    text: "E2E Read Article.*"
- tapOn:
    id: drawer_menu_button
- tapOn:
    id: drawer_settings_button
- scrollUntilVisible:
    element:
      id: settings_reading_behavior
    direction: DOWN
    timeout: 10000
- tapOn:
    id: settings_reading_behavior
- tapOn:
    id: reading_behavior_mark_read_when_scrolling
    point: "90%,50%"
- scrollUntilVisible:
    element:
      id: reading_behavior_read_articles
    direction: DOWN
    timeout: 10000
- tapOn:
    id: reading_behavior_read_articles
- assertNotVisible: "Unavailable while.*"
- assertVisible:
    id: reading_behavior_read_articles_hide_right_away
    enabled: true
- tapOn:
    id: reading_behavior_read_articles_hide_right_away
- assertVisible: ".*Read articles.*Hide right away.*"
- tapOn:
    id: BackButton
- tapOn:
    id: settings_done_button
- tapOn:
    id: drawer_timeline
    optional: true
- assertNotVisible:
    text: "E2E Read Article.*"
- stopApp
- launchApp
- tapOn:
    id: drawer_menu_button
- tapOn:
    id: drawer_settings_button
- scrollUntilVisible:
    element:
      id: settings_reading_behavior
    direction: DOWN
    timeout: 10000
- tapOn:
    id: settings_reading_behavior
- assertVisible: ".*Reader \\(feed\\)"
- scrollUntilVisible:
    element:
      id: reading_behavior_read_articles
    direction: DOWN
    timeout: 10000
- tapOn:
    id: reading_behavior_read_articles
- assertVisible:
    id: reading_behavior_read_articles_hide_right_away
    selected: true
