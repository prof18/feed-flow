appId: com.prof18.feedflow.dev
---
- launchApp
- openLink: feedflow://e2e/reset-and-seed?profile=content-rich
- tapOn:
    text: "^Open$"
    optional: true
- assertVisible:
    id: e2e_seed_complete
- tapOn:
    id: drawer_menu_button
- tapOn:
    id: drawer_settings_button
- scrollUntilVisible:
    element:
      id: settings_reading_behavior
    direction: DOWN
    timeout: 10000
- tapOn:
    id: settings_reading_behavior
- tapOn:
    id: reading_behavior_article_open_mode
- tapOn:
    id: article_open_mode_feed_content
- assertVisible: ".*Reader \\(feed\\)"
# "Mark as read when scrolling" is on: Hide right away stays listed but cannot be selected.
- scrollUntilVisible:
    element: "Hide right away is off while.*articles stay in place as you scroll.*"
    direction: DOWN
    timeout: 10000
- assertVisible:
    id: reading_behavior_read_articles_hide_right_away
    enabled: false
- tapOn: "Hide right away"
- assertNotVisible:
    id: reading_behavior_read_articles_hide_right_away
    selected: true
- tapOn: "Keep in list"
- tapOn:
    id: BackButton
- tapOn:
    id: settings_done_button
- tapOn:
    id: drawer_timeline
    optional: true
- assertVisible:
    text: "E2E Read Article.*"
- launchApp
- assertVisible:
    text: "E2E Read Article.*"
- tapOn:
    id: drawer_menu_button
- tapOn:
    id: drawer_settings_button
- scrollUntilVisible:
    element:
      id: settings_reading_behavior
    direction: DOWN
    timeout: 10000
- tapOn:
    id: settings_reading_behavior
- tapOn:
    id: reading_behavior_mark_read_when_scrolling
    point: "90%,50%"
- scrollUntilVisible:
    element: "Choose when articles you have read leave your lists\\."
    direction: DOWN
    timeout: 10000
- assertVisible:
    id: reading_behavior_read_articles_hide_right_away
    enabled: true
- tapOn: "Hide right away"
- assertVisible:
    id: reading_behavior_read_articles_hide_right_away
    selected: true
- tapOn:
    id: BackButton
- tapOn:
    id: settings_done_button
- tapOn:
    id: drawer_timeline
    optional: true
- assertNotVisible:
    text: "E2E Read Article.*"
- stopApp
- launchApp
- tapOn:
    id: drawer_menu_button
- tapOn:
    id: drawer_settings_button
- scrollUntilVisible:
    element:
      id: settings_reading_behavior
    direction: DOWN
    timeout: 10000
- tapOn:
    id: settings_reading_behavior
- scrollUntilVisible:
    element:
      id: reading_behavior_read_articles_hide_right_away
    direction: DOWN
    timeout: 10000
- assertVisible:
    id: reading_behavior_read_articles_hide_right_away
    selected: true
