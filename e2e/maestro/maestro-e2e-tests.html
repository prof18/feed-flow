<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FeedFlow Maestro E2E Tests</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f7f3ea;
      --ink: #1c2430;
      --muted: #667085;
      --line: #d8cdbf;
      --panel: #fffaf2;
      --accent: #0b6b61;
      --accent-ink: #ffffff;
      --chip: #e7ded1;
      --shadow: 0 18px 40px rgb(55 45 32 / 12%);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #151917;
        --ink: #f3efe5;
        --muted: #a9b2aa;
        --line: #33403b;
        --panel: #1f2724;
        --accent: #5ec4b6;
        --accent-ink: #06201d;
        --chip: #2b3632;
        --shadow: none;
      }
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background:
        linear-gradient(135deg, rgb(11 107 97 / 12%), transparent 36rem),
        radial-gradient(circle at 90% 8%, rgb(194 92 62 / 18%), transparent 28rem),
        var(--bg);
      color: var(--ink);
      font-family: "IBM Plex Sans", "Avenir Next", "Segoe UI", sans-serif;
      line-height: 1.5;
    }

    a {
      color: var(--accent);
    }

    header {
      max-width: 1180px;
      margin: 0 auto;
      padding: 48px 24px 24px;
    }

    h1 {
      margin: 0 0 12px;
      font-size: clamp(2rem, 5vw, 4rem);
      line-height: 1;
      letter-spacing: 0;
    }

    .lede {
      max-width: 760px;
      margin: 0;
      color: var(--muted);
      font-size: 1.05rem;
    }

    main {
      max-width: 1180px;
      margin: 0 auto;
      padding: 16px 24px 64px;
    }

    .summary {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 12px;
      margin: 24px 0;
    }

    .metric,
    .section {
      background: color-mix(in srgb, var(--panel) 94%, transparent);
      border: 1px solid var(--line);
      box-shadow: var(--shadow);
    }

    .metric {
      padding: 18px;
      border-radius: 8px;
    }

    .metric strong {
      display: block;
      font-size: 2rem;
      line-height: 1;
    }

    .metric span {
      color: var(--muted);
      font-size: 0.92rem;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      justify-content: space-between;
      margin: 28px 0 14px;
    }

    .links {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .button {
      display: inline-flex;
      min-height: 38px;
      align-items: center;
      border-radius: 6px;
      background: var(--accent);
      color: var(--accent-ink);
      padding: 8px 12px;
      text-decoration: none;
      font-weight: 700;
    }

    .button.secondary {
      background: var(--chip);
      color: var(--ink);
    }

    input {
      width: min(100%, 360px);
      min-height: 38px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--panel);
      color: var(--ink);
      padding: 8px 12px;
      font: inherit;
    }

    .section {
      margin: 14px 0;
      border-radius: 8px;
      overflow: hidden;
    }

    .section h2 {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: baseline;
      justify-content: space-between;
      margin: 0;
      border-bottom: 1px solid var(--line);
      padding: 14px 16px;
      font-size: 1.08rem;
      letter-spacing: 0;
    }

    .count {
      color: var(--muted);
      font-size: 0.9rem;
      font-weight: 500;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th,
    td {
      border-bottom: 1px solid var(--line);
      padding: 9px 16px;
      text-align: left;
      vertical-align: top;
    }

    tr:last-child td {
      border-bottom: 0;
    }

    th {
      color: var(--muted);
      font-size: 0.78rem;
      text-transform: uppercase;
    }

    code {
      font-family: "SFMono-Regular", Consolas, monospace;
      font-size: 0.9em;
    }

    .coverage {
      max-width: 44rem;
      color: var(--muted);
    }

    .tag {
      display: inline-flex;
      border-radius: 999px;
      background: var(--chip);
      padding: 2px 8px;
      color: var(--muted);
      font-size: 0.78rem;
      font-weight: 700;
      text-transform: uppercase;
    }

    .empty {
      display: none;
      margin: 24px 0;
      color: var(--muted);
    }

    @media (max-width: 720px) {
      header {
        padding-top: 32px;
      }

      th:nth-child(4),
      td:nth-child(4) {
        display: none;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>FeedFlow Maestro E2E Tests</h1>
    <p class="lede">Renderable list of user-facing tasks covered by automated Maestro flows. The Markdown catalogue remains the source for known limitations and run instructions.</p>
  </header>

  <main>
    <section class="summary" aria-label="Summary">
      <div class="metric"><strong id="total-count">0</strong><span>automated flow files</span></div>
      <div class="metric"><strong>13</strong><span>smoke coverage IDs</span></div>
      <div class="metric"><strong>67</strong><span>regression coverage IDs</span></div>
