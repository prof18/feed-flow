#Gradle
org.gradle.jvmargs=-Xms4g -Xmx4g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError -XX:+UseParallelGC -Djava.net.preferIPv4Stack=true
kotlin.daemon.jvmargs=-Xms4g -Xmx4g -XX:+UseParallelGC -Djava.net.preferIPv4Stack=true
org.gradle.caching=true

org.gradle.configuration-cache=true

#Kotlin
kotlin.code.style=official

#Android
android.useAndroidX=true
android.nonTransitiveRClass=true

#MPP
kotlin.mpp.enableCInteropCommonization=true

releaseBuild=false

kotlin.mpp.androidSourceSetLayoutVersion=2

## Composite Builds
macOsAppStoreRelease=false

kotlin.native.ignoreDisabledTargets=true

# macOS 26: prefer IPv4 to avoid sandbox "Operation not permitted" on IPv6
# If you are behind Meta X2P, proxy is configured via ~/.gradle/gradle.properties
# (systemProp.http.proxyHost=localhost / https proxy port 10054) - do not commit proxy here.
